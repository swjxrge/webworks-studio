<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bootstrap Play</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4">

    
    <div class="row mb-4">
      <div class="col-12">
        <h1>Paintball</h1>
        <p>My Bootstrap practice page.</p>
        <a href="#gear" class="btn btn-primary">View Gear</a>
      </div>
    </div>

    
    <div class="row g-3 mb-4" id="gear">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title h5">Marker</h2>
            <p class="card-text">Launches paintballs.</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title h5">Mask</h2>
            <p class="card-text">Protects your face.</p>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h2 class="card-title h5">Loader</h2>
            <p class="card-text">Holds paintballs.</p>
          </div>
        </div>
      </div>
    </div>

    
    <div class="row g-3">
      <div class="col-md-4">
        <h2>Game Day</h2>
        <p>Saturday at the field.</p>
      </div>

      <div class="col-md-8">
        <div class="accordion" id="faq">
          <div class="accordion-item">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed"
                      type="button"
                      data-bs-toggle="collapse"
                      data-bs-target="#answer"
                      aria-expanded="false"
                      aria-controls="answer">
                What should I bring?
              </button>
            </h2>
            <div id="answer" class="accordion-collapse collapse"
                 data-bs-parent="#faq">
              <div class="accordion-body">
                Bring your gear, water, and paintballs.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
